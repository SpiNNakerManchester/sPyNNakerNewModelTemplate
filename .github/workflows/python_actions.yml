name: Python Actions
on: [push]
permissions:
  contents: read
jobs:
  call:
    uses: SpiNNakerManchester/SupportScripts/.github/workflows/python_checks.yml@main
    with:
      dependencies: SpiNNUtils SpiNNMachine SpiNNMan PACMAN spalloc SpiNNFrontEndCommon sPyNNaker TestBase
      test-directories: unittests
      coverage-package: pacman
      flake8-packages: examples python_models nmt_integration_tests unittests
      pylint-packages: examples python_models nmt_integration_tests unittests
      # Limit which pylint messages matter
      pylint-exitcheck: 39
      # currently examples are not type annotated
      mypy-full-packages:
      ruff-packages: examples python_models nmt_integration_tests unittests
    secrets: inherit
